<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>文档截图 fixture</title>
    <!-- 与文档站详情页同一套底：token 与实际会引的第三方样式 -->
    <link rel="stylesheet" href="/src/tokens/tokens.css" />
    <link rel="stylesheet" href="/dist/element-plus.css" />
    <style>
      html,
      body {
        margin: 0;
        background: #fff;
      }
      /* 这一页只负责「让组件排成它能有的宽度」，出图由截图脚本截取元素包围盒。
         视口宽度由脚本给（16:9 的 1280），body 铺满它、把组件居中即可。 */
      body {
        /* 用 min-height 而不是 height：height 是确定值，组件里的 `height: 100%`
           （my-list 那种「撑满高度区域」的写法）会照着铺满整个视口，分页被顶到底部，
           中间留下大片空白；min-height 不算确定高度，百分比退化成 auto，组件按内容撑开。 */
        min-height: 100vh;
        display: flex;
        /* column：垂直居中交给 justify-content，水平居中交给 align-items */
        flex-direction: column;
        justify-content: safe center;
        /* 不用 stretch：那会把一个按钮拉成整行宽 */
        align-items: center;
        box-sizing: border-box;
        /* 不留边距：组件能用的宽度就是整个视口宽，够它排成桌面形态而不折行。
           组件自己那层（.ew-my-list 的 padding）就是它的内边距，不用这边再补。 */
        padding: 0;
      }
      /* 截图截取的是这个盒子（组件 + 四周留白），而非组件本身：按钮若顶到边缘，
         缩进卡片后会被视为被裁切，留一些白边才呈现为完整组件。 */
      .shot-box {
        padding: 16px;
      }
      /* 组件挂了 shadow root，但宿主元素本身在 light DOM，这么选得到。
         宽表格（my-list）不加这条会顶出外层盒子右边。 */
      .shot-box > * {
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <!-- 组件由 scripts/snapshot.ts 逐张包进 .shot-box 后插入，这里不预置任何内容。
         也刻意不放脚本：截图页的行为全部由截图脚本经 CDP 驱动，
         留下 JS 只会给「截出来的是什么」增加一个难以确定的变量。 -->
  </body>
</html>
